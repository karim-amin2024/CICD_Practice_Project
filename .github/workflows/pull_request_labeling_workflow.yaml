name: Run labeled tests
on: 
  # first set the name of the event
  pull_request: 
    # here define the event type.
    types: [labeled]

jobs:
  build:
    if: ${{github.event.label.name == 'build'}}
    runs-on: ubuntu-latest
    steps:
      - name: clone the repo under test on the Runner machine
        uses: actions/checkout@v7
      - name: setup the dependencies
        run: npm ci
      - name: Build the SW under test
        run: npm run build
      - name: uploading the build artifacts on the Jfrog
        run: echo "Uploading the build artifacts on the Jfrog"
      - name: output the context var. for more info
        env:
          EVENT_CONTEXT: ${{ toJSON(github.event) }}
        run: echo "$EVENT_CONTEXT"


  somke-test:
    if: ${{github.event.label.name == 'smoke-test'}}
    runs-on: ubuntu-latest
    steps:   
      - name: clone the repo under test on the Runner machine
        uses: actions/checkout@v7
        
      - name: setup the dependencies
        run: npm ci

      - name: Run the static analysis test cases.
        run: npm run lint

      - name: telling the user that the label is not defined
        run: echo "Label is not defined"

      - name: output the context var. for more info
        env:
          EVENT_CONTEXT: ${{ toJSON(github.event) }}
        run: echo "$EVENT_CONTEXT"

  full-test:
    if: ${{github.event.label.name == 'full-test'}}
    runs-on: ubuntu-latest
    steps:
      - name: clone the repo under test on the Runner machine
        uses: actions/checkout@v7
        
      - name: setup the dependencies
        run: npm ci 

      - name: Run the Full Test suit 
        run: npm run test

      - name: Upload the test result if needed
        run: echo "uploading results"
      