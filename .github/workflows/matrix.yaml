name: Matrix Demo 
on: 
  push: 
    branches:
      - master
jobs:
  build:
    continue-on-error: true
    strategy:
      matrix:
        # specifying different values for keys used in the current job steps
        node-version: [12,14,16]
        operating-system: [ubuntu-latest,windows-latest]
        # include keyword adds more combinations to an existing matrix 
        include:
          - node-version: 18
            operating-system: ubuntu-latest
        # exclude keyword removes combinations from an existing matrix
        exclude:
          - node-version: 12
            operating-system: windows-latest
    # This will run the Job multiple times with all possible configured values (Combinations) for the Runner Os
    # the Multiple Jobs will run in parallel 
    runs-on: ${{matrix.operating-system}}
    steps:
      - name: Get the Code
        uses: actions/checkout@v4
      - name: Install NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: ${{matrix.node-version}}
      - name: Install dependencies
        run: npm ci
      - name: Build project
        run: npm run build