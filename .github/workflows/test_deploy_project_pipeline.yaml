name: Test_Deploy
# This workflow would be triggered when Commit Push happened or manually(using github GUI or github APIs).
on: [workflow_dispatch,push]
jobs:
  # Performing the static and dynamic testing togther in one job
  lint_test:
    runs-on: ubuntu-latest
    steps:
      # init the test environment Tools versions
      - name: setup the needed nodeJs version on the Runner
        uses: actions/setup-node@v7
        with:
          node-version: 'latest'
      # The repo source code doesn't exist by default on the Runner.
      # it mandatory to checkout the repo to access the source code and even the test cases.
      - name: Checkout the repo on the Runner
        uses: actions/checkout@v7
      # Install all the SW packages which are needed to build and run the application and the test suit
      - name: Install the Project dependencies 
        run: npm ci
      # Run the static anlysis tests on the App
      - name: Run Lint on the Project
        run: npm run lint
      # Run the dynamic test cases on the App
      - name: Run Test on the Project
        run: npm run test
  # this CI Job would run after this job "lint_test" to be executed and finished without any error or failures.
  deploy:
    needs: lint_test
    runs-on: ubuntu-latest
    steps:
      - name: setup the needed nodeJs version on the Runner
        uses: actions/setup-node@v7
        with:
          node-version: 'latest'
      
      - name: Checkout the repo on the Runner
        uses: actions/checkout@v7

      - name: Install the Project dependencies 
        run: npm ci
        
      - name: Build the application to deploy
        run: npm run build

      - name: Deploy the application on the Production Server
        run: echo "Deploying the application on the Server......."


